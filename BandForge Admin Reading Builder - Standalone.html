document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ox-shadow:0 8px 22px rgba(13,31,60,0.04);margin-bottom:20px;\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;\">\n          <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:17px;color:#0D1F3C;\">Passage<\u002Fdiv>\n          <div style=\"font-family:'DM Mono',monospace;font-size:12px;color:#94A3B8;\">{{ wordCountLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n        <textarea placeholder=\"Paste or type the reading passage here…\" value=\"{{ passageText }}\" sc-camel-on-change=\"{{ onPassageChange }}\" rows=\"10\" style=\"width:100%;border:1px solid #E4E9F0;border-radius:12px;padding:16px 18px;font-size:14.5px;line-height:1.65;color:#28374E;background:#FBFCFD;resize:vertical;font-weight:300;\"><\u002Ftextarea>\n      <\u002Fdiv>\n\n      <!-- QUESTION TYPE SELECTOR -->\n      <div style=\"background:#FFFFFF;border:1px solid #EAEEF3;border-radius:18px;padding:26px 28px;box-shadow:0 8px 22px rgba(13,31,60,0.04);margin-bottom:20px;\">\n        <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:17px;color:#0D1F3C;margin-bottom:16px;\">Add a question<\u002Fdiv>\n        <div style=\"font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:#94A3B8;margin-bottom:10px;\">Question type<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;\">\n          <sc-for list=\"{{ questionTypes }}\" as=\"t\" hint-placeholder-count=\"14\">\n            <div class=\"chip\" sc-camel-on-click=\"{{ t.onSelect }}\" style=\"border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;border:1.5px solid {{ t.borderColor }};background:{{ t.bg }};color:{{ t.color }};\">{{ t.name }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ onOpenDraft }}\" style=\"display:inline-flex;align-items:center;gap:8px;border:none;background:var(--accent,#00BCD4);color:#0D1F3C;font-family:'DM Sans',sans-serif;font-weight:700;font-size:14px;padding:12px 20px;border-radius:11px;cursor:pointer;box-shadow:0 10px 24px rgba(0,188,212,0.28);\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0D1F3C\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg>Add question — {{ selectedType }}<\u002Fbutton>\n      <\u002Fdiv>\n\n      <!-- DRAFT QUESTION BUILDER CARD -->\n      <sc-if value=\"{{ draftOpen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#F8FCFD;border:1.5px solid #C7EBF0;border-radius:18px;padding:26px 28px;margin-bottom:20px;\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;\">\n            <div style=\"font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent,#0097A7);\">{{ draft.editingLabel }} · {{ draft.type }}<\u002Fdiv>\n            <span sc-camel-on-click=\"{{ onCancelDraft }}\" class=\"icon-btn\" style=\"font-size:13px;color:#94A3B8;font-weight:600;\">Cancel<\u002Fspan>\n          <\u002Fdiv>\n\n          <label style=\"display:block;font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:#94A3B8;margin-bottom:8px;\">Question text<\u002Flabel>\n          <textarea placeholder=\"Enter the question or blank sentence…\" value=\"{{ draft.text }}\" sc-camel-on-change=\"{{ draft.onTextChange }}\" rows=\"2\" style=\"width:100%;border:1px solid #E4E9F0;border-radius:11px;padding:12px 14px;font-size:14px;color:#0D1F3C;background:#FFFFFF;margin-bottom:20px;resize:vertical;\"><\u002Ftextarea>\n\n          <sc-if value=\"{{ draft.isOptionType }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;\">\n              <label style=\"display:block;font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:#94A3B8;\">Options — {{ draft.correctHint }}<\u002Flabel>\n              <sc-if value=\"{{ draft.optionsAddable }}\" hint-placeholder-val=\"{{ false }}\">\n                <span sc-camel-on-click=\"{{ draft.onAddOption }}\" class=\"icon-btn\" style=\"font-size:12.5px;font-weight:600;color:var(--accent,#0097A7);\">+ Add option<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:9px;margin-bottom:20px;\">\n              <sc-for list=\"{{ draft.options }}\" as=\"opt\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;align-items:center;gap:10px;\">\n                  <input type=\"{{ draft.inputType }}\" name=\"draft-correct\" checked=\"{{ opt.correct }}\" sc-camel-on-change=\"{{ opt.onToggleCorrect }}\" style=\"width:17px;height:17px;accent-color:#00BCD4;flex-shrink:0;\">\n                  <input type=\"text\" placeholder=\"Option text…\" value=\"{{ opt.label }}\" sc-camel-on-change=\"{{ opt.onLabelChange }}\" disabled=\"{{ opt.locked }}\" style=\"flex:1;border:1px solid #E4E9F0;border-radius:9px;padding:9px 12px;font-size:13.5px;color:#0D1F3C;background:{{ opt.bg }};\">\n                  <sc-if value=\"{{ draft.optionsAddable }}\" hint-placeholder-val=\"{{ false }}\">\n                    <span sc-camel-on-click=\"{{ opt.onRemove }}\" class=\"icon-btn\" style=\"color:#B4474B;font-size:16px;line-height:1;padding:0 4px;\">×<\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ draft.isTextType }}\" hint-placeholder-val=\"{{ false }}\">\n            <label style=\"display:block;font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:#94A3B8;margin-bottom:8px;\">Correct answer<\u002Flabel>\n            <input type=\"text\" placeholder=\"Correct answer…\" value=\"{{ draft.answer }}\" sc-camel-on-change=\"{{ draft.onAnswerChange }}\" style=\"width:100%;border:1px solid #E4E9F0;border-radius:11px;padding:11px 14px;font-size:14px;color:#0D1F3C;background:#FFFFFF;margin-bottom:14px;\">\n\n            <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;\">\n              <label style=\"display:block;font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:#94A3B8;\">Alternate accepted answers<\u002Flabel>\n              <span sc-camel-on-click=\"{{ draft.onAddAlt }}\" class=\"icon-btn\" style=\"font-size:12.5px;font-weight:600;color:var(--accent,#0097A7);\">+ Add alternate<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:9px;margin-bottom:20px;\">\n              <sc-for list=\"{{ draft.altAnswers }}\" as=\"alt\" hint-placeholder-count=\"0\">\n                <div style=\"display:flex;align-items:center;gap:10px;\">\n                  <input type=\"text\" placeholder=\"Alternate answer…\" value=\"{{ alt.value }}\" sc-camel-on-change=\"{{ alt.onChange }}\" style=\"flex:1;border:1px solid #E4E9F0;border-radius:9px;padding:9px 12px;font-size:13.5px;color:#0D1F3C;background:#FFFFFF;\">\n                  <span sc-camel-on-click=\"{{ alt.onRemove }}\" class=\"icon-btn\" style=\"color:#B4474B;font-size:16px;line-height:1;padding:0 4px;\">×<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"display:flex;gap:10px;\">\n            <button sc-camel-on-click=\"{{ onSaveDraft }}\" style=\"border:none;background:var(--accent,#00BCD4);color:#0D1F3C;font-family:'DM Sans',sans-serif;font-weight:700;font-size:13.5px;padding:11px 18px;border-radius:10px;cursor:pointer;\">{{ draft.saveLabel }}<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ onCancelDraft }}\" style=\"background:#FFFFFF;border:1.5px solid #CDD7E2;color:#0D1F3C;font-family:'DM Sans',sans-serif;font-weight:600;font-size:13.5px;padding:11px 18px;border-radius:10px;cursor:pointer;\">Cancel<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- QUESTION LIST -->\n      <div style=\"background:#FFFFFF;border:1px solid #EAEEF3;border-radius:18px;padding:26px 28px;box-shadow:0 8px 22px rgba(13,31,60,0.04);\">\n        <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:17px;color:#0D1F3C;margin-bottom:16px;\">Questions<\u002Fdiv>\n\n        <sc-if value=\"{{ noQuestions }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:13.5px;color:#94A3B8;padding:8px 2px;\">No questions yet — pick a type above and add one.<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex;flex-direction:column;gap:10px;\">\n          <sc-for list=\"{{ questions }}\" as=\"q\" hint-placeholder-count=\"0\">\n            <div class=\"qrow\" style=\"border:1px solid #EAEEF3;border-radius:13px;padding:14px 16px;\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;\" sc-camel-on-click=\"{{ q.onToggleExpand }}\">\n                <div style=\"display:flex;align-items:center;gap:12px;min-width:0;\">\n                  <span style=\"font-family:'DM Mono',monospace;font-size:12px;font-weight:600;color:var(--accent,#0097A7);background:#E6F6F8;border-radius:7px;padding:4px 8px;flex-shrink:0;\">Q{{ q.number }}<\u002Fspan>\n                  <div style=\"min-width:0;\">\n                    <div style=\"font-size:11px;font-family:'DM Mono',monospace;color:#94A3B8;text-transform:uppercase;letter-spacing:0.06em;\">{{ q.type }}<\u002Fdiv>\n                    <div style=\"font-size:14px;font-weight:600;color:#0D1F3C;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{ q.textPreview }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:16px;flex-shrink:0;\">\n                  <span sc-camel-on-click=\"{{ q.onEdit }}\" class=\"icon-btn\" style=\"font-size:12.5px;font-weight:600;color:var(--accent,#0097A7);\">Edit<\u002Fspan>\n                  <span sc-camel-on-click=\"{{ q.onDelete }}\" class=\"icon-btn\" style=\"font-size:12.5px;font-weight:600;color:#B4474B;\">Delete<\u002Fspan>\n                  <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#94A3B8\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"transform:{{ q.chevronRotate }};transition:transform .15s;\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ q.expanded }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin-top:12px;padding-top:12px;border-top:1px solid #F1F4F8;\">\n                  <div style=\"font-size:14px;color:#28374E;margin-bottom:10px;\">{{ q.text }}<\u002Fdiv>\n                  <div style=\"font-size:13px;color:#5A6B82;\">{{ q.correctSummary }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n\n  <!-- ===================== STICKY BOTTOM BAR ===================== -->\n  <div style=\"position:fixed;left:0;right:0;bottom:0;background:#0D1F3C;border-top:1px solid rgba(255,255,255,0.08);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;z-index:20;\">\n    <div style=\"max-width:1100px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between;\">\n      <div style=\"font-family:'DM Mono',monospace;font-size:12.5px;color:#7689A0;\">{{ questionCountLabel }}<\u002Fdiv>\n      <div style=\"display:flex;gap:12px;\">\n        <button sc-camel-on-click=\"{{ onTogglePreview }}\" style=\"display:flex;align-items:center;gap:8px;background:transparent;border:1.5px solid rgba(255,255,255,0.22);color:#FFFFFF;font-family:'DM Sans',sans-serif;font-weight:600;font-size:14px;padding:11px 18px;border-radius:11px;cursor:pointer;\">{{ previewLabel }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ onSaveAll }}\" style=\"border:none;background:var(--accent,#00BCD4);color:#0D1F3C;font-family:'DM Sans',sans-serif;font-weight:700;font-size:14px;padding:12px 22px;border-radius:11px;cursor:pointer;box-shadow:0 10px 24px rgba(0,188,212,0.30);\">Save<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:1000},&quot;accent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Signal Cyan&quot;,&quot;Cobalt&quot;,&quot;Violet&quot;],&quot;default&quot;:&quot;Signal Cyan&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pageTone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Paper&quot;,&quot;Cool&quot;,&quot;Warm&quot;],&quot;default&quot;:&quot;Paper&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nconst ALL_TYPES = ['True/False/Not Given','Yes/No/Not Given','Matching headings','Sentence completion','Matching information','Matching features','Matching sentence endings','Summary completion (from box)','Summary completion (from passage)','Note completion','Table completion','Flow-chart completion','Short answer questions','Multiple choice'];\nconst FIXED_OPTIONS = { 'True/False/Not Given': ['True','False','Not Given'], 'Yes/No/Not Given': ['Yes','No','Not Given'] };\nconst CHECKBOX_TYPES = ['Matching headings','Matching information','Matching features','Matching sentence endings','Summary completion (from box)'];\nconst TEXT_TYPES = ['Sentence completion','Summary completion (from passage)','Note completion','Table completion','Flow-chart completion','Short answer questions'];\n\nclass Component extends DCLogic {\n  state = {\n    passageText: '',\n    selectedType: ALL_TYPES[0],\n    draftOpen: false,\n    draft: null,\n    editingId: null,\n    questions: [],\n    expanded: {},\n    previewMode: false\n  };\n  uid = 1;\n  nextId() { return 'q' + (this.uid++); }\n\n  constructor(props) {\n    super(props);\n    this.rootRef = React.createRef();\n  }\n  shade(hex) {\n    try {\n      const n = parseInt(hex.replace('#', ''), 16);\n      let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;\n      r = Math.round(r * 0.82); g = Math.round(g * 0.82); b = Math.round(b * 0.82);\n      return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);\n    } catch (e) { return hex; }\n  }\n  applyVars() {\n    const el = this.rootRef.current;\n    if (!el) return;\n    const accents = { 'Signal Cyan': '#00BCD4', 'Cobalt': '#2D6BE0', 'Violet': '#7C5CE0' };\n    const pages = { 'Paper': '#F5F7FA', 'Cool': '#EDF1F7', 'Warm': '#F6F3EE' };\n    const a = accents[this.props.accent] || '#00BCD4';\n    const p = pages[this.props.pageTone] || '#F5F7FA';\n    el.style.setProperty('--accent', a);\n    el.style.setProperty('--accent-dark', this.shade(a));\n    el.style.setProperty('--page', p);\n  }\n  componentDidMount() { this.applyVars(); }\n  componentDidUpdate() { this.applyVars(); }\n\n  isOptionType(type) { return !!FIXED_OPTIONS[type] || CHECKBOX_TYPES.includes(type) || type === 'Multiple choice'; }\n  isCheckbox(type) { return CHECKBOX_TYPES.includes(type); }\n  optionsAddable(type) { return !FIXED_OPTIONS[type] && this.isOptionType(type); }\n\n  makeDefaultOptions(type) {\n    if (FIXED_OPTIONS[type]) return FIXED_OPTIONS[type].map((label, i) => ({ id: 'o' + i, label, correct: false, locked: true }));\n    if (type === 'Multiple choice') return ['A','B','C','D'].map((l, i) => ({ id: 'o' + i, label: '', correct: false, locked: false }));\n    return [1,2,3,4].map(i => ({ id: 'o' + i, label: '', correct: false, locked: false }));\n  }\n\n  openDraft() {\n    const type = this.state.selectedType;\n    const isOpt = this.isOptionType(type);\n    this.setState({\n      draftOpen: true,\n      editingId: null,\n      draft: {\n        type,\n        text: '',\n        options: isOpt ? this.makeDefaultOptions(type) : [],\n        answer: '',\n        altAnswers: []\n      }\n    });\n  }\n  editQuestion(id) {\n    const q = this.state.questions.find(x => x.id === id);\n    if (!q) return;\n    this.setState({\n      draftOpen: true,\n      editingId: id,\n      selectedType: q.type,\n      draft: {\n        type: q.type,\n        text: q.text,\n        options: q.options ? q.options.map(o => ({ ...o })) : [],\n        answer: q.answer || '',\n        altAnswers: (q.altAnswers || []).map((v, i) => ({ id: 'a' + i, value: v }))\n      }\n    });\n  }\n  cancelDraft() { this.setState({ draftOpen: false, draft: null, editingId: null }); }\n\n  saveDraft() {\n    const d = this.state.draft;\n    if (!d) return;\n    const record = {\n      id: this.state.editingId || this.nextId(),\n      type: d.type,\n      text: d.text,\n      options: this.isOptionType(d.type) ? d.options : null,\n      answer: TEXT_TYPES.includes(d.type) ? d.answer : null,\n      altAnswers: TEXT_TYPES.includes(d.type) ? d.altAnswers.map(a => a.value).filter(Boolean) : []\n    };\n    this.setState(s => {\n      let questions;\n      if (s.editingId) {\n        questions = s.questions.map(q => q.id === s.editingId ? record : q);\n      } else {\n        questions = [...s.questions, record];\n      }\n      return { questions, draftOpen: false, draft: null, editingId: null };\n    });\n  }\n\n  updateDraft(patch) { this.setState(s => ({ draft: { ...s.draft, ...patch } })); }\n  updateOption(optId, patch) {\n    this.setState(s => ({\n      draft: { ...s.draft, options: s.draft.options.map(o => o.id === optId ? { ...o, ...patch } : o) }\n    }));\n  }\n  toggleCorrect(optId) {\n    const checkbox = this.isCheckbox(this.state.draft.type);\n    this.setState(s => ({\n      draft: {\n        ...s.draft,\n        options: s.draft.options.map(o => {\n          if (checkbox) return o.id === optId ? { ...o, correct: !o.correct } : o;\n          return { ...o, correct: o.id === optId };\n        })\n      }\n    }));\n  }\n  addOption() {\n    this.setState(s => ({ draft: { ...s.draft, options: [...s.draft.options, { id: 'o' + Date.now(), label: '', correct: false, locked: false }] } }));\n  }\n  removeOption(optId) {\n    this.setState(s => ({ draft: { ...s.draft, options: s.draft.options.filter(o => o.id !== optId) } }));\n  }\n  addAlt() {\n    this.setState(s => ({ draft: { ...s.draft, altAnswers: [...s.draft.altAnswers, { id: 'a' + Date.now(), value: '' }] } }));\n  }\n  updateAlt(altId, value) {\n    this.setState(s => ({ draft: { ...s.draft, altAnswers: s.draft.altAnswers.map(a => a.id === altId ? { ...a, value } : a) } }));\n  }\n  removeAlt(altId) {\n    this.setState(s => ({ draft: { ...s.draft, altAnswers: s.draft.altAnswers.filter(a => a.id !== altId) } }));\n  }\n  toggleExpand(id) {\n    this.setState(s => ({ expanded: { ...s.expanded, [id]: !s.expanded[id] } }));\n  }\n  deleteQuestion(id) {\n    this.setState(s => ({ questions: s.questions.filter(q => q.id !== id) }));\n  }\n\n  renderVals() {\n    const s = this.state;\n    const wordCount = s.passageText.trim() ? s.passageText.trim().split(/\\s+/).length : 0;\n\n    const questionTypes = ALL_TYPES.map(name => {\n      const selected = name === s.selectedType;\n      return {\n        name,\n        onSelect: () => this.setState({ selectedType: name }),\n        bg: selected ? '#E6F6F8' : '#FFFFFF',\n        color: selected ? '#0097A7' : '#5A6B82',\n        borderColor: selected ? 'var(--accent,#00BCD4)' : '#E4E9F0'\n      };\n    });\n\n    let draft = null;\n    if (s.draftOpen && s.draft) {\n      const d = s.draft;\n      const isOpt = this.isOptionType(d.type);\n      const checkbox = this.isCheckbox(d.type);\n      draft = {\n        type: d.type,\n        editingLabel: s.editingId ? 'Editing question' : 'New question',\n        text: d.text,\n        onTextChange: (e) => this.updateDraft({ text: e.target.value }),\n        isOptionType: isOpt,\n        isTextType: TEXT_TYPES.includes(d.type),\n        inputType: checkbox ? 'checkbox' : 'radio',\n        correctHint: checkbox ? 'check all correct' : 'select the correct one',\n        optionsAddable: this.optionsAddable(d.type),\n        onAddOption: () => this.addOption(),\n        options: (d.options || []).map(o => ({\n          id: o.id,\n          label: o.label,\n          correct: o.correct,\n          locked: !!o.locked,\n          bg: o.locked ? '#F1F4F8' : '#FFFFFF',\n          onToggleCorrect: () => this.toggleCorrect(o.id),\n          onLabelChange: (e) => this.updateOption(o.id, { label: e.target.value }),\n          onRemove: () => this.removeOption(o.id)\n        })),\n        answer: d.answer,\n        onAnswerChange: (e) => this.updateDraft({ answer: e.target.value }),\n        altAnswers: (d.altAnswers || []).map(a => ({\n          id: a.id, value: a.value,\n          onChange: (e) => this.updateAlt(a.id, e.target.value),\n          onRemove: () => this.removeAlt(a.id)\n        })),\n        onAddAlt: () => this.addAlt(),\n        saveLabel: s.editingId ? 'Save changes' : 'Save question'\n      };\n    }\n\n    const questions = s.questions.map((q, i) => {\n      const isOpt = this.isOptionType(q.type);\n      let correctSummary;\n      if (isOpt) {\n        const correctLabels = (q.options || []).filter(o => o.correct).map(o => o.label || '(untitled option)');\n        correctSummary = correctLabels.length ? 'Correct: ' + correctLabels.join(', ') : 'No correct answer marked';\n      } else {\n        correctSummary = q.answer ? 'Answer: ' + q.answer + (q.altAnswers && q.altAnswers.length ? ' (+ ' + q.altAnswers.length + ' alt.)' : '') : 'No answer set';\n      }\n      return {\n        id: q.id,\n        number: i + 1,\n        type: q.type,\n        text: q.text || '(no question text)',\n        textPreview: q.text || '(no question text)',\n        correctSummary,\n        expanded: !!s.expanded[q.id],\n        chevronRotate: s.expanded[q.id] ? 'rotate(180deg)' : 'rotate(0deg)',\n        onToggleExpand: () => this.toggleExpand(q.id),\n        onEdit: (e) => { e.stopPropagation(); this.editQuestion(q.id); },\n        onDelete: (e) => { e.stopPropagation(); this.deleteQuestion(q.id); }\n      };\n    });\n\n    const previewQuestions = s.questions.map((q, i) => ({\n      id: q.id,\n      number: i + 1,\n      type: q.type,\n      text: q.text || '(no question text)',\n      isOptionType: this.isOptionType(q.type),\n      isTextType: TEXT_TYPES.includes(q.type),\n      inputType: this.isCheckbox(q.type) ? 'checkbox' : 'radio',\n      options: (q.options || []).map(o => ({ label: o.label || '(untitled option)' }))\n    }));\n\n    return {\n      rootRef: this.rootRef,\n      passageText: s.passageText,\n      passageDisplay: s.passageText || '(no passage added yet)',\n      onPassageChange: (e) => this.setState({ passageText: e.target.value }),\n      wordCountLabel: wordCount + (wordCount === 1 ? ' word' : ' words'),\n      questionTypes,\n      selectedType: s.selectedType,\n      onOpenDraft: () => this.openDraft(),\n      draftOpen: s.draftOpen,\n      draft,\n      onSaveDraft: () => this.saveDraft(),\n      onCancelDraft: () => this.cancelDraft(),\n      questions: s.previewMode ? previewQuestions : questions,\n      noQuestions: s.questions.length === 0,\n      questionCountLabel: s.questions.length + (s.questions.length === 1 ? ' question added' : ' questions added'),\n      previewMode: s.previewMode,\n      builderMode: !s.previewMode,\n      previewLabel: s.previewMode ? 'Back to builder' : 'Preview as Student',\n      onTogglePreview: () => this.setState(st => ({ previewMode: !st.previewMode })),\n      onSaveAll: () => {}\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
